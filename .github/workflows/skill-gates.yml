name: skill-gates

on:
  pull_request:
  push:
    branches: [main]
  # Every tsn version leg, weekly: a runner image or a new stable toolchain can
  # break a leg while nothing in this repo changes (rust 1.99, 2026-09-28).
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-gate:
    # Ubuntu only, by the owner's choice (2026-10-06): a macOS leg ran the full
    # gate in ~20 min at 10x the billed rate and was the bulk of every PR's CI
    # cost. macOS is covered by the owner running `make gate` locally on macOS
    # before a PR; CI does NOT prove macOS. The gate scripts are BSD/GNU awk- and
    # locale-sensitive and factory-conductor's re-entry has launchd-only code, so
    # a contributor not on macOS should say so in the PR.
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The since-pin reachability self-test in scripts/ab-validate.py asks
          # whether each SINCE_* commit is an ancestor of origin/main or HEAD.
          # checkout's default depth-1 clone has no history, so NOTHING is an
          # ancestor of anything and every pin reads as orphaned. Full history
          # is also what lets `make ab-validate` resolve a merge-base baseline
          # rather than skipping.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED, not assumed. `test-safety-net`'s node guard is the sole runtime
      # enforcement of that skill's headline invariant on the node stack, and
      # both the gate suite (`assets/test_io_guard_node.sh`) and eval check 39
      # SKIP where `node` is absent — passing without having graded anything.
      # GitHub's runner images happen to ship node, so this was being graded by
      # accident; a runner image that stopped shipping it would have turned a
      # silent skip green on every PR.
      - name: Install pytest
        # The Python guard IS a pytest plugin, and ~20 of its tests drive it
        # through a real pytest process. Without pytest here they skip, and a
        # skipped test proves nothing: the guard's plugin path -- the only
        # invocation the documentation gives a user -- would go permanently
        # ungraded in CI while the gate reported green. The ranker itself
        # stays stdlib-only; this is a test-time dependency, not a shipped one.
        run: python -m pip install --quiet pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # PINNED, like node. `test-safety-net`'s go guard is the sole runtime
      # enforcement on the go stack, and its suite (`assets/test_io_guard_go.py`)
      # and eval check 44 SKIP where `go` is absent. The guard also finds its hook
      # targets by name in the installed toolchain's sources, so the version CI
      # proves is the version the docs claim. `cache: false`: there is no go.sum
      # in this repo for setup-go to key a module cache on.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      # PINNED, like go. The rust guard is the sole runtime enforcement on the
      # rust stack, and its suites and eval check 49 SKIP where `cargo` is
      # absent. rustup ships on both runner images; nothing is downloaded but
      # the toolchain itself.
      - name: Rust 1.98
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98
      - name: Run skill quality gates
        run: make gate

  # Which tsn version legs run (owner decision 2026-10-08: "filter + edges,
  # full weekly"). A PR that touches the guard, its eval, its docs or this file
  # runs the edges: the oldest and newest version of each stack, plus the
  # current stable rust. Any other PR runs none. A push to main, the weekly
  # schedule and a manual run prove every version. The rules and the two
  # matrices live in scripts/ci/tsn-scope.sh.
  tsn-scope:
    name: tsn scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff BASE...HEAD` needs the merge base in the clone.
          fetch-depth: 0
      - id: scope
        run: sh scripts/ci/tsn-scope.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}"

  # test-safety-net supports the LAST FIVE VERSIONS of python, node and go, and
  # five rust minors across about two years (1.82, 1.86, 1.90, 1.94, 1.98: every
  # 4th, because the last five would span only ~7 months), plus the current
  # stable 1.99 -- teams on legacy
  # code have the oldest toolchains and the fewest tests -- and a support claim
  # nobody runs is a claim nobody has checked. Each leg runs that stack's suites
  # on one version. Measured before this job existed: the python guard missed
  # every pathlib read on 3.10, the node suite parsed a reporter node 26 no
  # longer defaults to, and the go guard could not run on 1.22-1.23 at all.
  # All legs are ubuntu (amd64), so the rust legs are also the rust guard's
  # only amd64 runs: its hook was developed on arm64. The darwin link and hook
  # are proven only by the owner's local macOS `make gate` (pinned versions).
  # tsn-scope picks the legs; on a PR that does not touch the guard this job
  # is skipped.
  versions:
    name: tsn ${{ matrix.stack }} ${{ matrix.version }}${{ matrix.os && format(' ({0})', matrix.os) || '' }}
    needs: tsn-scope
    if: needs.tsn-scope.outputs.mode != 'none'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tsn-scope.outputs.matrix) }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: test-safety-net/assets
    steps:
      - uses: actions/checkout@v4
      # The python legs run the guard UNDER the version being proved; every
      # other leg still needs a python for the ranker and the suites.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.stack == 'python' && matrix.version || '3.12' }}
      - if: matrix.stack == 'python'
        run: python -m pip install --quiet pytest
      - if: matrix.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - if: matrix.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - if: matrix.stack == 'rust'
        run: rustup toolchain install ${{ matrix.version }} --profile minimal && rustup default ${{ matrix.version }}
      # Non-rust legs still run the full eval, whose check 49 builds the rust
      # guard with whatever cargo is on PATH. Unpinned, that is the runner
      # image's rust, so an image bump (ubuntu-24.04 20261004) broke every
      # python/node/go leg with "invalid definition of the runtime `open`
      # symbol" while the pinned rust legs passed. Pin it like the gate job.
      - if: matrix.stack != 'rust'
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98
      - if: matrix.stack == 'python'
        run: |
          python test_rank_risk.py
          python test_io_guard.py
      - if: matrix.stack == 'node'
        run: |
          python test_stack_node.py
          sh test_io_guard_node.sh
      - if: matrix.stack == 'go'
        run: |
          python test_stack_go.py
          python test_io_guard_go.py
      - if: matrix.stack == 'rust'
        run: |
          python test_stack_rust.py
          python test_rust_binary.py
          python test_io_guard_rust.py
      - name: outcome eval on this version
        working-directory: test-safety-net
        run: python eval/run_eval.py

  # skill-contract's reference checker: vectors and the end-to-end handoff at
  # both ends of the supported Python range (3.10 floor, 3.14). Ubuntu only
  # (owner's choice, 2026-10-06), so CI no longer proves it on Windows or macOS.
  # Each file stays its own step so re-adding a pwsh leg needs no rework (pwsh
  # does not stop at a failing native command inside a multi-line `run`).
  contract:
    name: skill-contract (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/skill-contract/reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: conformance vectors
        run: python -I test_contract_check.py
      - name: end-to-end handoff
        run: python -I test_e2e.py

  # Branch protection requires a check named exactly `gate`. A matrix job reports
  # one check PER LEG ("gate (ubuntu-latest)", ...) and never the bare name, so
  # adding the matrix silently removed the required context and left every PR
  # blocked with green CI. This aggregator restores it: one check called `gate`
  # that passes only when every leg passed. Keep it if you add another OS.
  # `versions` may be `skipped` ONLY when tsn-scope succeeded and said "none";
  # a skip for any other reason (tsn-scope failed) fails the gate.
  gate:
    name: gate
    needs: [matrix-gate, tsn-scope, versions, contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg, the selected language versions and the contract legs to pass
        run: |
          gate="${{ needs.matrix-gate.result }}"
          scope="${{ needs.tsn-scope.result }}"
          mode="${{ needs.tsn-scope.outputs.mode }}"
          versions="${{ needs.versions.result }}"
          contract="${{ needs.contract.result }}"
          echo "matrix: $gate  scope: $scope ($mode)  versions: $versions  contract: $contract"
          [ "$gate" = "success" ] && [ "$scope" = "success" ] && [ "$contract" = "success" ] || exit 1
          [ "$versions" = "success" ] && exit 0
          [ "$versions" = "skipped" ] && [ "$mode" = "none" ] && exit 0
          exit 1
