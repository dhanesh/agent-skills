name: skill-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skill-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-gate:
    # The gates are shell scripts whose behaviour is locale- and awk-dependent,
    # and they are developed on macOS/BSD. Running only ubuntu meant the platform
    # where they are weakest was the one CI never exercised.
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The since-pin reachability self-test in scripts/ab-validate.py asks
          # whether each SINCE_* commit is an ancestor of origin/main or HEAD.
          # checkout's default depth-1 clone has no history, so NOTHING is an
          # ancestor of anything and every pin reads as orphaned. Full history
          # is also what lets `make ab-validate` resolve a merge-base baseline
          # rather than skipping.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED, not assumed. `test-safety-net`'s node guard is the sole runtime
      # enforcement of that skill's headline invariant on the node stack, and
      # both the gate suite (`assets/test_io_guard_node.sh`) and eval check 39
      # SKIP where `node` is absent — passing without having graded anything.
      # GitHub's runner images happen to ship node, so this was being graded by
      # accident; a runner image that stopped shipping it would have turned a
      # silent skip green on every PR.
      - name: Install pytest
        # The Python guard IS a pytest plugin, and ~20 of its tests drive it
        # through a real pytest process. Without pytest here they skip, and a
        # skipped test proves nothing: the guard's plugin path -- the only
        # invocation the documentation gives a user -- would go permanently
        # ungraded in CI while the gate reported green. The ranker itself
        # stays stdlib-only; this is a test-time dependency, not a shipped one.
        run: python -m pip install --quiet pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # PINNED, like node. `test-safety-net`'s go guard is the sole runtime
      # enforcement on the go stack, and its suite (`assets/test_io_guard_go.py`)
      # and eval check 44 SKIP where `go` is absent. The guard also finds its hook
      # targets by name in the installed toolchain's sources, so the version CI
      # proves is the version the docs claim. `cache: false`: there is no go.sum
      # in this repo for setup-go to key a module cache on.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Run skill quality gates
        run: make gate

  # test-safety-net supports the LAST FIVE VERSIONS of every language it covers
  # -- teams on legacy code have the oldest toolchains and the fewest tests --
  # and a support claim nobody runs is a claim nobody has checked. Each leg runs
  # that stack's suites on one version. Measured before this job existed: the
  # python guard missed every pathlib read on 3.10, the node suite parsed a
  # reporter node 26 no longer defaults to, and the go guard could not run on
  # 1.22-1.23 at all. ubuntu only: the full gate above already covers macOS on
  # the pinned versions.
  versions:
    name: tsn ${{ matrix.stack }} ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stack: python, version: "3.10"}
          - {stack: python, version: "3.11"}
          - {stack: python, version: "3.12"}
          - {stack: python, version: "3.13"}
          - {stack: python, version: "3.14"}
          - {stack: node, version: "18"}
          - {stack: node, version: "20"}
          - {stack: node, version: "22"}
          - {stack: node, version: "24"}
          - {stack: node, version: "26"}
          - {stack: go, version: "1.22"}
          - {stack: go, version: "1.23"}
          - {stack: go, version: "1.24"}
          - {stack: go, version: "1.25"}
          - {stack: go, version: "1.26"}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: test-safety-net/assets
    steps:
      - uses: actions/checkout@v4
      # The python legs run the guard UNDER the version being proved; every
      # other leg still needs a python for the ranker and the suites.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.stack == 'python' && matrix.version || '3.12' }}
      - if: matrix.stack == 'python'
        run: python -m pip install --quiet pytest
      - if: matrix.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - if: matrix.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - if: matrix.stack == 'python'
        run: |
          python test_rank_risk.py
          python test_io_guard.py
      - if: matrix.stack == 'node'
        run: |
          python test_stack_node.py
          sh test_io_guard_node.sh
      - if: matrix.stack == 'go'
        run: |
          python test_stack_go.py
          python test_io_guard_go.py
      - name: outcome eval on this version
        working-directory: test-safety-net
        run: python eval/run_eval.py

  # Branch protection requires a check named exactly `gate`. A matrix job reports
  # one check PER LEG ("gate (ubuntu-latest)", ...) and never the bare name, so
  # adding the matrix silently removed the required context and left every PR
  # blocked with green CI. This aggregator restores it: one check called `gate`
  # that passes only when every leg passed. Keep it if you add another OS.
  gate:
    name: gate
    needs: [matrix-gate, versions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg and every language version to pass
        run: |
          gate="${{ needs.matrix-gate.result }}"
          versions="${{ needs.versions.result }}"
          echo "matrix result: $gate  versions result: $versions"
          [ "$gate" = "success" ] && [ "$versions" = "success" ] || exit 1
