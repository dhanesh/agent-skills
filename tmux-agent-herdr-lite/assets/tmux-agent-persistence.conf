# Tmux Agent Herdr-Lite — optional persistence layer (Herdr-like session
# survival across tmux server restarts / reboots).
#
# Requires TPM (tmux plugin manager). Install TPM once:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then ensure ~/.tmux.conf ends with:  run '~/.tmux/plugins/tpm/tpm'
# and press prefix + I inside tmux to fetch the plugins below.
#
# install.sh sources this file automatically only when TPM is already present,
# so a plain install stays offline.

# tmux-resurrect: save/restore sessions, windows, panes, layouts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum: autosave every few minutes and auto-restore on server start.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore what agents had on screen, not just the layout.
set -g @resurrect-capture-pane-contents 'on'
# Relaunch agent CLIs that were running when the server died (tilde prefix =
# match by command name). Pair with `agent-resume` to reattach native agent
# sessions (claude --resume, codex resume, ...) instead of starting cold.
set -g @resurrect-processes '"~claude" "~codex" "~gemini" "~opencode" "~cursor-agent" "~copilot" "~droid" "~amp"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
