# Tmux Agent Herdr-Lite integration
# Source from ~/.tmux.conf (the installer wires this automatically):
#   source-file ~/.tmux/agent-panes/tmux-agent.conf
#
# Design: the cockpit claims exactly ONE prefix key (prefix a) and puts every
# action in its own `agent` key-table. It therefore never collides with your own
# bindings and needs no Shift. Pane navigation, splits, zoom, copy-mode, and the
# status-bar layout stay entirely yours — this file only appends to them.

# --- Settings (additive; nothing here rebinds a key you own) ---
set -g mouse on
set -g status-interval 5
set -g mode-keys vi
set -g focus-events on
set -g pane-border-status top
set -g pane-border-format ' #P #{pane_current_command} #{pane_title} '

# Window tabs show the folder (basename of the pane's cwd) instead of the running
# command — which is otherwise always "zsh" or an agent's version string.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
setw -g aggressive-resize on

# NOTE: the fleet summary is NOT force-injected into your status bar (that would
# clobber or duplicate a hand-built one). To show it, add this to your own
# status-right:  #(@AGENT_BIN@/agent-status-summary)

# --- Cockpit key-table: prefix a, then one lowercase key (no Shift anywhere) ---
bind-key a switch-client -T agent

# prefix a d : dashboard popup      prefix a m : menu (launch/worktree/resume)
# prefix a s : refresh status scan  prefix a t : session/window tree
bind-key -T agent d display-popup -E -w 90% -h 80% '@AGENT_BIN@/agent-dashboard; printf "\nPress Enter..."; read'
bind-key -T agent m run-shell '@AGENT_BIN@/agent-menu'
bind-key -T agent s run-shell '@AGENT_BIN@/agent-status-scan'
bind-key -T agent t choose-tree -Zw

# Jump to the first pane in a state. '|| true' silences tmux's "returned 1" dump
# on a no-match (agent-jump already prints a status-line message).
# prefix a b : blocked   e : error   w : working   i : idle   f : finished/done
bind-key -T agent b run-shell '@AGENT_BIN@/agent-jump blocked || true'
bind-key -T agent e run-shell '@AGENT_BIN@/agent-jump error || true'
bind-key -T agent w run-shell '@AGENT_BIN@/agent-jump working || true'
bind-key -T agent i run-shell '@AGENT_BIN@/agent-jump idle || true'
bind-key -T agent f run-shell '@AGENT_BIN@/agent-jump done || true'
